name: CI - Validate Configs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq curl bash python3-yaml

      - name: Validate Tmux configuration syntax
        run: |
          tmux -f tmux.conf start-server \; kill-server
          tmux -f tmux.conf.omarchy start-server \; kill-server

      - name: Validate Bash scripts syntax
        run: |
          bash -n bash_theme.sh bashrc bash_profile
          bash -n scripts/check-plugin-updates.sh scripts/tmux-notify scripts/tmux-whisper

      - name: Validate YAML config syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('config/tmux-which-key/config.yaml'))"
