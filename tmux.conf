# --- 1. Auto-Bootstrap TPM ---
if-shell "test -z \"$CI\" && test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# =============================================
# 🚀 THE GOD CONFIG (WSL + ARCH + NVIM)
# =============================================

# --- Keybindings (Ctrl-b is prefix; Ctrl-a unbound for tmux-which-key / shell) ---
set -g prefix C-b
unbind C-a
bind C-b send-prefix

# Start numbering at 1 (Better for keyboard reach)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload Config (Matches standard tmux path)
bind r source-file ~/.tmux.conf \; run-shell -b "$HOME/.local/bin/tmux-notify push 'Config reloaded'"

# --- General ---
set -g default-terminal "tmux-256color"
set -su terminal-features
set -as terminal-features ",*:RGB,*:usstyle"           # True Color & undercurls
set -s escape-time 0                           # No lag for Nvim
set -g history-limit 1000000                  # Infinite scrollback
set -g status-position top                    # Clean top bar
set -g focus-events on                        # Let Nvim know when it has focus
set -g mouse on                               # Click panes/tabs & scroll

# --- 📂 Smart Path Tracking (Always open in same path) ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# --- Navigation & Resizing ---
# Pane switching (C-h/j/k/l) is handled by christoomey/vim-tmux-navigator
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Clipboard Support (WSL + Linux Wayland/X11) ---
setw -g mode-keys vi
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell "command -v clip.exe >/dev/null 2>&1" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip.exe'; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'clip.exe'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null'; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null'"

# --- 🎤 Whisper Voice Dictation (Alt-v toggles background record/transcribe) ---
bind -n M-v run-shell -b "$HOME/.local/bin/tmux-whisper toggle #{pane_id}"

# --- 🔔 Corner Notifications (Click time+notify zone or press Alt-n) ---
bind -n M-n display-popup -E -b rounded -x C -y 1 -w 72 -h 20 -T " 󰂚 Notifications " "$HOME/.local/bin/tmux-notify ui"

# Quick tools: btm, macchina, cfspeedtest, and agy ~/Work/error
bind B display-popup -E -b rounded -w 90% -h 85% -T "  System Monitor (btm) " "btm"
bind M display-popup -E -b rounded -w 60% -h 55% -T " 󰍹 System Summary (macchina) " "bash -c 'macchina; echo; read -n 1 -s -r -p \"Press any key to close...\"'"
bind S display-popup -E -b rounded -w 60% -h 55% -T " 󰛳 Speed Test (cfspeedtest) " "bash -c 'cfspeedtest; echo; read -n 1 -s -r -p \"Press any key to close...\"'"
bind E new-window "bash -lic 'mkdir -p \"$HOME/Work/error\" && cd \"$HOME/Work/error\" && agy; exec bash'"

# Theme switcher (Ctrl+Alt+Shift+Space / Ctrl+Alt+Space)
bind -n C-M-S-Space run-shell -b "$HOME/.local/bin/tmux-theme-switch"
bind -n C-M-Space run-shell -b "$HOME/.local/bin/tmux-theme-switch"

# =============================================
# 🎨 STATUS BAR & THEME (delegated to tmux-theme-switch)
# =============================================
set -g status-interval 5
set -g display-time 1500
set -g status-justify left
set -g status-left-length 10
set -g status-left " "
set -g window-status-separator " "
set -g status-right-length 140
run-shell -b "$HOME/.local/bin/tmux-theme-switch apply"

# =============================================
# 📦 PLUGINS (TPM)
# =============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Plugin Settings
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @tmux-which-key-xdg-enable 1

# Initialize TPM
if-shell "test -x ~/.tmux/plugins/tpm/tpm" \
   "run '~/.tmux/plugins/tpm/tpm'"
