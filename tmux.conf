# --- 1. Auto-Bootstrap TPM ---
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# =============================================
# 🚀 THE GOD CONFIG (WSL + ARCH + NVIM)
# =============================================
theme_color="green"
# --- Keybindings (Leader is Ctrl-a) ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Add this to the bottom of ~/.tmux.conf.local
bind r source-file ~/.config/tmux/tmux.conf \; display "🚀 Config Reloaded!"
# --- General ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB" # True Color
# set -g mouse on                                # Mouse support
set -s escape-time 0                           # No lag for Nvim
set -g history-limit 1000000                   # Infinite scrollback
set -g status-position top                     # Clean top bar
set -g focus-events on                         # Let Nvim know when it has focus


# Easier splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane switching (seamless with Nvim)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# --- Windows Clipboard (The WSL Secret) ---
# Allows 'y' in copy mode to hit your Windows clipboard instantly
# set-window-option -g mode-keys vi
# bind-key -T copy-mode-vi v send-step -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# =============================================
# Config for status bar
# =============================================
set -g status-style "bg=default,fg=default"
# set -g status-justify "center"
set -g status-left ""
set -g status-right '#[fg=red] %H:%M:%S | #{pane_current_command} |  #{b:pane_current_path} | 󱫋 #P | 󰊢 #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) |'
set -g window-status-format "  #I "
set -g window-status-current-format '  #{?client_prefix,#[fg=red]●#[fg=default],●} '
set -g window-status-separator ""


# =============================================
# 📦 PLUGINS (TPM)
# =============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Better search and copy (Vi mode)
setw -g mode-keys vi
set -g @plugin 'tmux-plugins/tmux-copycat'

# Set refresh interval (1 second) so the keys update quickly
set -g status-interval 1

# Display: [Prefix?] | [Last 3 Keys] | [Session Name]
set -g status-left-length 40


# --- Smart Path Tracking ---

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# Improved Splitting (Vertical and Horizontal)
# Using - and | as you had, but ensuring path persistence
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Optional: Also bind \ to horizontal (easier on some keyboards)
bind \\ split-window -h -c "#{pane_current_path}"

# Initialize TPM (Keep at the bottom)
run-shell "~/.tmux/plugins/tpm/bin/install_plugins all"
run-shell "~/.tmux/plugins/tpm/bin/update_plugins all"
run '~/.tmux/plugins/tpm/tpm'
