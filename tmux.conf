# --- 1. Auto-Bootstrap TPM ---
if-shell "test -z \"$CI\" && test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# =============================================
# 🚀 THE GOD CONFIG (WSL + ARCH + NVIM)
# =============================================

# --- Keybindings (Ctrl-a opens which-key menu; Ctrl-b is fallback prefix) ---
set -g prefix C-b
unbind C-a
bind C-b send-prefix

# Start numbering at 1 (Better for keyboard reach)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload Config (Matches standard tmux path)
bind r source-file ~/.tmux.conf \; run-shell -b "$HOME/.local/bin/tmux-notify push 'Config reloaded'"

# --- General ---
set -g default-terminal "tmux-256color"
set -su terminal-features
set -as terminal-features ",*:RGB,*:usstyle"           # True Color & undercurls
set -s escape-time 0                           # No lag for Nvim
set -g history-limit 1000000                  # Infinite scrollback
set -g status-position top                    # Clean top bar
set -g focus-events on                        # Let Nvim know when it has focus
set -g mouse on                               # Click panes/tabs & scroll

# --- 📂 Smart Path Tracking (Always open in same path) ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# --- Navigation & Resizing ---
# Pane switching (C-h/j/k/l) is handled by christoomey/vim-tmux-navigator
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Clipboard Support (WSL + Linux Wayland/X11) ---
setw -g mode-keys vi
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell "command -v clip.exe >/dev/null 2>&1" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip.exe'; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'clip.exe'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null'; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null'"

# --- 🎤 Whisper Voice Dictation (Alt-v toggles background record/transcribe) ---
bind -n M-v run-shell -b "$HOME/.local/bin/tmux-whisper toggle #{pane_id}"

# --- 🔔 Corner Notifications (Click time+notify zone or press Alt-n) ---
bind -n M-n display-popup -E -b rounded -x C -y 1 -w 72 -h 20 -T " Notifications " "$HOME/.local/bin/tmux-notify ui"

# =============================================
# 🎨 STATUS BAR — CYBERPUNK
# Palette: cyan #00d7ff  emerald #00ff87  purple #af5fff
#          amber #ffaf00  charcoal #1a1a2e  void #0d0d0d
# =============================================
set -g status-interval 5
set -g display-time 1500
set -g status-justify absolute-centre           # Windows list dead-centre

# Base canvas & UI chrome
set -g status-style              "bg=#0d0d0d,fg=#a8a8a8"
set -g message-style             "bg=#1a1a2e,fg=#00d7ff,bold"
set -g message-command-style     "bg=#1a1a2e,fg=#af5fff,bold"
set -g pane-border-style         "fg=#2a2a2a"
set -g pane-active-border-style  "fg=#00d7ff"
set -g mode-style                "bg=#af5fff,fg=#0d0d0d,bold"

# ── LEFT: [◈ SESSION] ▌ PATH ▌ COMMAND ──────────────────────────────
set -g status-left-length 80
set -g status-left "\
#[bg=#00d7ff,fg=#0d0d0d,bold] ◈ #S \
#[bg=#1a1a2e,fg=#00d7ff,nobold]  #{b:pane_current_path} \
#[bg=#0d0d0d,fg=#1a1a2e]\
#[fg=#555555]  #{pane_current_command} \
#[fg=#2a2a2a] ┆ "

# ── CENTRE: Windows (absolute-centre) ───────────────────────────────
set -g window-status-separator ""
set -g window-status-format "\
#[bg=#0d0d0d,fg=#333333]  #I:#W  "
set -g window-status-current-format "\
#[bg=#0d0d0d,fg=#1a1a2e]\
#[bg=#1a1a2e,fg=#00d7ff,bold]#{?client_prefix,#[fg=#ff5f5f] ⌨ #I,  #I}#[fg=#6a6a8a,nobold] :#W \
#[bg=#0d0d0d,fg=#1a1a2e]"

# ── RIGHT: NOTIFY ┆ ⏱ TIME ┆ 󰊢 GIT ┆ PANE ────────────────────────
set -g status-right-length 100
set -g status-right "\
#[fg=#2a2a2a]┆ \
#{@whisper_status}\
#{?#{@notify_count},\
#[bg=#ffaf00,fg=#0d0d0d,bold]  #{@notify_count} #{@notify_preview}\
#[bg=#0d0d0d,fg=#ffaf00],\
#[fg=#333333]  }\
#[fg=#2a2a2a] ┆ \
#[bg=#1a1a2e,fg=#0d0d0d]\
#[bg=#1a1a2e,fg=#00d7ff,bold]  %H:%M \
#[bg=#0d0d0d,fg=#1a1a2e]\
#[fg=#2a2a2a] ┆ \
#[fg=#af5fff]#(git -C #{q:pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/.*/󰊢 &/') \
#[fg=#2a2a2a]┆ \
#[fg=#444444]󱫋 #P "

# =============================================
# 📦 PLUGINS (TPM)
# =============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Plugin Settings
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @tmux-which-key-xdg-enable 1

# Initialize TPM
if-shell "test -x ~/.tmux/plugins/tpm/tpm" \
   "run '~/.tmux/plugins/tpm/tpm'"
